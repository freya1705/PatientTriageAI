services:
  - type: web
    name: patienttriage-ai
    env: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: NODE_VERSION
        value: 20.11.0
